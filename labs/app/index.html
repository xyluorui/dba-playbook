<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互实验室 · DBA Playbook</title>
<meta name="description" content="DBA Playbook 交互实验室：把 MySQL 机制做成可单步观察的交互实验">
<script>
  // 主题预置，避免闪烁
  try {
    if (localStorage.getItem('lab-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ── 顶栏 ── -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <ellipse cx="12" cy="5.5" rx="7.5" ry="3"></ellipse>
          <path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"></path>
          <path d="M4.5 11.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"></path>
        </svg>
      </div>
      <div class="brand-text">
        <b>DBA PLAYBOOK</b>
        <span>交互实验室 · INTERACTIVE LABS</span>
      </div>
    </div>

    <div class="now-learning">
      <span class="eyebrow">正在学习</span>
      <div class="now-title" id="hdr-title">—</div>
      <div class="step-dots" id="hdr-steps"></div>
    </div>

    <div class="hdr-right">
      <div class="progress">
        <div class="pct" id="hdr-pct">0%</div>
        <div class="bar"><i id="hdr-bar"></i></div>
        <div class="pcount" id="hdr-count">已完成 0 / 6 步</div>
      </div>
      <button class="icon-btn" id="theme-toggle" title="切换明暗主题">
        <svg class="theme-ico moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
        <svg class="theme-ico sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
      <a class="icon-btn link" href="../demo-sql-journey.html" title="返回知识库">↩ 知识库</a>
    </div>
  </header>

  <!-- ── 工作区 ── -->
  <div class="workspace">

    <!-- 左：课程目录 -->
    <aside class="panel catalog">
      <div class="panel-head">
        <h2>课程目录</h2>
        <span class="hint">P0 · 逐步上线</span>
      </div>
      <div class="cat-tabs" id="cat-tabs"></div>
      <div class="cat-list" id="cat-list"></div>
    </aside>

    <!-- 中：画面 -->
    <main class="stage">
      <div class="stage-head">
        <div class="view-tabs">
          <button data-view="topology" class="on">网络</button>
          <button data-view="sequence">时序</button>
        </div>
        <div class="stage-hint" id="stage-hint">点「单步」开始</div>
      </div>
      <div class="canvas">
        <svg id="canvas-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="inspector hidden" id="inspector"></div>
    </main>

    <!-- 右：实验概览 -->
    <aside class="panel info">
      <div class="panel-head">
        <h2>实验概览</h2>
      </div>
      <div class="info-scroll">
        <div class="info-title-row">
          <h3 id="info-title">—</h3>
          <span class="status-badge" id="info-status">学习中</span>
        </div>
        <p class="info-desc" id="info-desc"></p>
        <div class="meta-table" id="info-meta"></div>
        <div class="assump">
          <b>边界与假设</b>
          <ul id="info-assump"></ul>
        </div>
        <div class="challenge" id="info-challenge"></div>
      </div>
    </aside>

    <!-- 下：事件流 -->
    <section class="events">
      <div class="events-head">
        <h2>事件流</h2>
        <div class="legend" id="ev-legend"></div>
        <div class="controls">
          <button class="speed" id="btn-speed" title="播放速度">1×</button>
          <button class="btn btn-round" id="btn-prev" title="上一步（←）">‹</button>
          <button class="btn btn-round" id="btn-next" title="下一步（→）">›</button>
          <button class="btn btn-primary" id="btn-play">▶ 播放</button>
          <button class="btn" id="btn-step">单步</button>
          <button class="btn" id="btn-reset">重置</button>
        </div>
      </div>
      <div class="ev-table-wrap">
        <table class="ev-table">
          <thead>
            <tr><th>序号</th><th>时间</th><th>层次</th><th>对象</th><th>动作</th><th>证据</th></tr>
          </thead>
          <tbody id="ev-body"></tbody>
        </table>
      </div>
      <div class="ev-note">
        <span class="sample">示例</span>
        示例值：时间与报文为教学示意，每次真实执行都不同 ··
        教学中无法展示的细节：权限校验、网络传输、加密数据
      </div>
    </section>

  </div>

  <script src="scenes/sql-journey-select.js"></script>
  <script src="js/topology.js"></script>
  <script src="js/sequence.js"></script>
  <script src="js/inspector.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
